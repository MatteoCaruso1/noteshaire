<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteshAIre</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>NoteshAIre</div>
  <nav class="week"><span class="label">Week</span>
    <button id="prev" aria-label="Previous week">‹</button>
    <span id="weekLabel"></span>
    <button id="next" aria-label="Next week">›</button>
  </nav>
  <div id="status" class="status"></div>
</header>

<main>
  <div class="sec-head"><h2>Goals</h2><button class="edit-goals" id="editGoals" title="Edit goals" aria-label="Edit goals">✎</button></div>
  <section id="goals" class="goals"></section>
  <h2 class="sec">Stats</h2>
  <div id="insight" class="insight"></div>
  <div id="summary" class="summary"></div>
  <section id="days" class="days"></section>
  <section id="inbox" class="inbox" hidden></section>

  <div class="tabs" role="tablist">
    <button data-tab="songs" class="on">Songs</button>
    <button data-tab="technique">Technique</button>
    <button data-tab="noodling">Noodling</button>
    <button data-tab="log">Log</button>
    <button data-tab="trends">Trends</button>
  </div>
  <section id="tab-songs" class="tab"></section>
  <section id="tab-technique" class="tab" hidden></section>
  <section id="tab-noodling" class="tab" hidden></section>
  <section id="tab-log" class="tab" hidden></section>
  <section id="tab-trends" class="tab" hidden></section>
</main>

<dialog id="goalEdit">
  <form method="dialog">
    <div id="goalRows"></div>
    <div class="row-actions">
      <button type="button" id="addGoal" class="ghost">+ Goal</button>
      <span class="grow"></span>
      <button value="cancel" class="ghost">Cancel</button>
      <button id="saveGoals" value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>
<datalist id="songNames"></datalist>
<script src="app.js"></script>
</body>
</html>
