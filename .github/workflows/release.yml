# Push a tag like v1.0.2 -> one draft release is made, tests run, the Windows installer and the Mac apps are built into it,
# and it is published once both builds pass. Installed copies update themselves from it. The Mac apps are signed and
# notarized with Matteo's Developer ID when the repo's secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set (without them the Mac build is unsigned).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "NoteshAIre ${GITHUB_REF_NAME#v}" --notes "Download page: https://matteocaruso1.github.io/noteshaire/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  mac:
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: |
          # no certificate yet: build unsigned instead of reading an empty secret as a file path
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - run: |
          # GitHub's API sometimes answers 502 for a moment: try a few times
          for i in 1 2 3 4 5; do gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest && exit 0; sleep $((i * 15)); done; exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
